[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-panda-arena"
version = "0.1.0"
description = "Local synthetic-data arena for AI agent information-flow research"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.37,<2.1",
  "asyncmy>=0.2.10,<0.3",
  "cryptography>=44,<47",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
live = ["langgraph>=1,<2", "httpx>=0.27,<1"]
api = ["fastapi>=0.135,<1", "uvicorn>=0.32,<1", "httpx>=0.27,<1"]

[project.scripts]
reef-panda-arena = "reef_panda_arena.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
